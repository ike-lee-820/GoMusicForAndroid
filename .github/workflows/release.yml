name: Build Release APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/gomusic-release.jks
          ls -l keystore/

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore/gomusic-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "build-tools;34.0.0" || true

      - name: Verify signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          echo "== keystore entry =="
          $JAVA_HOME/bin/keytool -list -v -keystore keystore/gomusic-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "Alias name|Valid from|SHA256:"
          echo "== apk signer =="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
          echo "== compare =="
          KS_FP=$($JAVA_HOME/bin/keytool -list -v -keystore keystore/gomusic-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          APK_FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
            | grep -i "SHA-256 digest" | awk '{print $3}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore: $KS_FP"
          echo "apk     : $APK_FP"
          if [ -z "$KS_FP" ] || [ -z "$APK_FP" ] || [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::APK 签名与固定 keystore 不一致，正式版构建失败"
            exit 1
          fi
          echo "签名校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-release-apk
          path: app/build/outputs/apk/release/*.apk
