name: Build Release APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/gomusic-release.jks
          ls -l keystore/

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore/gomusic-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner（SDK: $SDK）"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          echo "== keystore entry =="
          $JAVA_HOME/bin/keytool -list -v -keystore keystore/gomusic-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "Alias name|Valid from|SHA256:"
          echo "== apk signer =="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
          echo "== compare =="
          KS_FP=$($JAVA_HOME/bin/keytool -list -v -keystore keystore/gomusic-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          APK_FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore: $KS_FP"
          echo "apk     : $APK_FP"
          if [ -z "$KS_FP" ] || [ -z "$APK_FP" ] || [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::APK 签名与固定 keystore 不一致，正式版构建失败"
            exit 1
          fi
          echo "签名校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.1.0"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，更新 APK"
          else
            gh release create "$TAG" --title "GoMusic $TAG" --notes "自动构建的正式版 APK（固定 keystore 签名）"
          fi
          gh release upload "$TAG" "$APK#GoMusic-$TAG.apk" --clobber
          echo "已发布到 Releases：$TAG"
