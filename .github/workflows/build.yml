name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        id: b
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish log
        if: always()
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@example.com
          git checkout -B ci-logs-android
          mkdir -p ci
          cp build.log ci/build.log || true
          git add -f ci/build.log
          git commit -m "ci log android $(date -u +%FT%TZ)" || echo none
          git push -f origin ci-logs-android
      - uses: actions/upload-artifact@v4
        with:
          name: GoMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
